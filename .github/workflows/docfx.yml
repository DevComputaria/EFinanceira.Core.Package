name: Build docfx

on:
  workflow_call:
    inputs:
      deploy:
        description: 'Deploy the generated site to GitHub Pages'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  run-docfx-build:
    name: Build docfx
    runs-on: windows-2025

    permissions:
      contents: read
      pages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        filter: 'tree:0'
        persist-credentials: false
        show-progress: false

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0

    - name: Install docfx
      shell: pwsh
      env:
        # renovate: datasource=nuget depName=docfx
        DOCFX_VERSION: '2.78.5'
      run: dotnet tool install -g docfx --version ${env:DOCFX_VERSION}

    - name: Build docfx
      shell: pwsh
      run: .\build\docfx.cmd

    - name: Upload Pages artifact
      if: ${{ inputs.deploy }}
      uses: actions/upload-pages-artifact@v3
      with:
        path: site

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: run-docfx-build
    if: ${{ inputs.deploy }}
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
